<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DIXX Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-page {
            min-height: 100vh;
            background: var(--dark);
            padding-top: 100px;
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .admin-header h1 {
            font-family: var(--font-display);
            font-size: 48px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00F0A0, #00D9FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 32px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            padding: 16px 32px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: var(--text);
            border-bottom-color: #00F0A0;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .orders-table,
        .customers-table {
            background: var(--dark-light);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(0, 240, 160, 0.1);
        }

        th {
            padding: 16px;
            text-align: left;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #00F0A0;
        }

        td {
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-completed {
            background: rgba(0, 240, 160, 0.2);
            color: #00F0A0;
        }

        .status-pending {
            background: rgba(255, 184, 0, 0.2);
            color: #FFB800;
        }

        .status-processing {
            background: rgba(0, 217, 255, 0.2);
            color: #00D9FF;
        }

        .payment-method {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--text-muted);
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .filter-bar {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .filter-bar input,
        .filter-bar select {
            padding: 12px 16px;
            background: var(--dark-light);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--font-primary);
        }

        .filter-bar input:focus,
        .filter-bar select:focus {
            outline: none;
            border-color: #00F0A0;
        }

        @media (max-width: 968px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .orders-table,
            .customers-table {
                overflow-x: auto;
            }

            table {
                min-width: 800px;
            }
        }
    </style>
</head>

<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo">DIXX<span class="logo-dot">.</span></a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="admin.html" style="color: #00F0A0;">Admin</a>
            </div>
        </div>
    </nav>

    <div class="admin-page">
        <div class="admin-container">
            <div class="admin-header">
                <h1>Admin Dashboard</h1>
                <button onclick="exportData()"
                    style="padding: 12px 24px; background: linear-gradient(135deg, #00F0A0, #00D9FF); color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">
                    Export Data
                </button>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total Orders</div>
                    <div class="stat-value" id="totalOrders">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Revenue</div>
                    <div class="stat-value" id="totalRevenue">$0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending Zelle</div>
                    <div class="stat-value" id="pendingZelle">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Customers</div>
                    <div class="stat-value" id="totalCustomers">0</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('orders')">Orders</button>
                <button class="tab" onclick="switchTab('customers')">Customers</button>
            </div>

            <!-- Orders Tab -->
            <div id="ordersTab" class="tab-content active">
                <div class="filter-bar">
                    <input type="text" id="orderSearch" placeholder="Search by order number or email..."
                        style="flex: 1;">
                    <select id="statusFilter" onchange="filterOrders()">
                        <option value="">All Statuses</option>
                        <option value="completed">Completed</option>
                        <option value="pending-zelle">Pending Zelle</option>
                        <option value="processing">Processing</option>
                    </select>
                    <select id="paymentFilter" onchange="filterOrders()">
                        <option value="">All Payment Methods</option>
                        <option value="credit-card">Credit Card</option>
                        <option value="zelle">Zelle</option>
                    </select>
                </div>

                <div class="orders-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Orders will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Customers Tab -->
            <div id="customersTab" class="tab-content">
                <div class="filter-bar">
                    <input type="text" id="customerSearch" placeholder="Search customers..." style="flex: 1;"
                        oninput="filterCustomers()">
                </div>

                <div class="customers-table">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Orders</th>
                                <th>Total Spent</th>
                                <th>Last Order</th>
                            </tr>
                        </thead>
                        <tbody id="customersTableBody">
                            <!-- Customers will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allOrders = [];
        let allCustomers = [];

        // Load orders from localStorage
        function loadOrders() {
            const orders = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('order_')) {
                    try {
                        const order = JSON.parse(localStorage.getItem(key));
                        orders.push(order);
                    } catch (e) {
                        console.error('Error parsing order:', e);
                    }
                }
            }
            allOrders = orders.sort((a, b) => new Date(b.orderDate) - new Date(a.orderDate));
            return allOrders;
        }

        // Calculate stats
        function calculateStats() {
            const orders = loadOrders();

            document.getElementById('totalOrders').textContent = orders.length;

            const totalRevenue = orders.reduce((sum, order) => sum + order.total, 0);
            document.getElementById('totalRevenue').textContent = '$' + totalRevenue.toFixed(2);

            const pendingZelle = orders.filter(o => o.paymentStatus === 'pending-zelle').length;
            document.getElementById('pendingZelle').textContent = pendingZelle;

            const customers = new Set(orders.map(o => o.email));
            document.getElementById('totalCustomers').textContent = customers.size;
        }

        // Render orders table
        function renderOrders(orders = allOrders) {
            const tbody = document.getElementById('ordersTableBody');

            if (orders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7">
                            <div class="empty-state">
                                <h3>No orders yet</h3>
                                <p>Orders will appear here once customers start purchasing.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td><strong>${order.orderNumber}</strong></td>
                    <td>${new Date(order.orderDate).toLocaleDateString()}</td>
                    <td>
                        <div>${order.firstName} ${order.lastName}</div>
                        <div style="font-size: 12px; color: var(--text-muted);">${order.email}</div>
                    </td>
                    <td>${order.items.length} items</td>
                    <td><strong>$${order.total.toFixed(2)}</strong></td>
                    <td>
                        <div class="payment-method">
                            ${order.paymentMethod === 'zelle' ? '💰' : '💳'}
                            ${order.paymentMethod === 'zelle' ? 'Zelle' : 'Credit Card'}
                        </div>
                    </td>
                    <td>
                        <span class="status-badge status-${order.paymentStatus === 'completed' ? 'completed' : order.paymentStatus === 'pending-zelle' ? 'pending' : 'processing'}">
                            ${order.paymentStatus === 'completed' ? 'Completed' : order.paymentStatus === 'pending-zelle' ? 'Pending Zelle' : 'Processing'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        // Filter orders
        function filterOrders() {
            const searchTerm = document.getElementById('orderSearch').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            const paymentFilter = document.getElementById('paymentFilter').value;

            let filtered = allOrders;

            if (searchTerm) {
                filtered = filtered.filter(order =>
                    order.orderNumber.toLowerCase().includes(searchTerm) ||
                    order.email.toLowerCase().includes(searchTerm) ||
                    `${order.firstName} ${order.lastName}`.toLowerCase().includes(searchTerm)
                );
            }

            if (statusFilter) {
                filtered = filtered.filter(order => order.paymentStatus === statusFilter);
            }

            if (paymentFilter) {
                filtered = filtered.filter(order => order.paymentMethod === paymentFilter);
            }

            renderOrders(filtered);
        }

        // Aggregate customer data
        function aggregateCustomers() {
            const customerMap = new Map();

            allOrders.forEach(order => {
                const email = order.email;
                if (!customerMap.has(email)) {
                    customerMap.set(email, {
                        name: `${order.firstName} ${order.lastName}`,
                        email: email,
                        phone: order.phone,
                        orders: [],
                        totalSpent: 0
                    });
                }

                const customer = customerMap.get(email);
                customer.orders.push(order);
                customer.totalSpent += order.total;
            });

            allCustomers = Array.from(customerMap.values()).sort((a, b) => b.totalSpent - a.totalSpent);
            return allCustomers;
        }

        // Render customers table
        function renderCustomers(customers = allCustomers) {
            const tbody = document.getElementById('customersTableBody');

            if (customers.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <h3>No customers yet</h3>
                                <p>Customer data will appear here once orders are placed.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = customers.map(customer => {
                const lastOrder = customer.orders.sort((a, b) => new Date(b.orderDate) - new Date(a.orderDate))[0];
                return `
                    <tr>
                        <td><strong>${customer.name}</strong></td>
                        <td>${customer.email}</td>
                        <td>${customer.phone}</td>
                        <td>${customer.orders.length}</td>
                        <td><strong>$${customer.totalSpent.toFixed(2)}</strong></td>
                        <td>${new Date(lastOrder.orderDate).toLocaleDateString()}</td>
                    </tr>
                `;
            }).join('');
        }

        // Filter customers
        function filterCustomers() {
            const searchTerm = document.getElementById('customerSearch').value.toLowerCase();

            const filtered = allCustomers.filter(customer =>
                customer.name.toLowerCase().includes(searchTerm) ||
                customer.email.toLowerCase().includes(searchTerm) ||
                customer.phone.includes(searchTerm)
            );

            renderCustomers(filtered);
        }

        // Switch tabs
        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(tab + 'Tab').classList.add('active');
        }

        // Export data
        function exportData() {
            const data = {
                orders: allOrders,
                customers: allCustomers,
                exportDate: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dixx-orders-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        // Search listeners
        document.getElementById('orderSearch').addEventListener('input', filterOrders);

        // Initialize
        loadOrders();
        calculateStats();
        renderOrders();
        aggregateCustomers();
        renderCustomers();

        // Auto-refresh every 30 seconds
        setInterval(() => {
            loadOrders();
            calculateStats();
            renderOrders();
            aggregateCustomers();
            renderCustomers();
        }, 30000);
    </script>
</body>

</html>
